[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "neuroreader"
description = "Read and parse NEV, NSx, and NFx files from Ripple Neuro neural recording devices"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Magesh Gauthaman", email = "neuroreader@raj-magesh.org" },
]
keywords = [
    "Ripple Neuro",
    "neural recording",
    "file formats",
    "NEV",
    "NSx",
    "NFx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
urls = { repository = "https://codeberg.org/raj-magesh/neuroreader" }
dependencies = ["numpy", "pint", "pandas", "pint-pandas", "xarray"]
version = "0.1.0"

[dependency-groups]
dev = ["ruff", "pytest", "sphinx"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
